# Public CI compiles source with pinned upstream dependencies and synthetic data.
# No real SIWC credentials, inference, release publishing or binary uploads.
name: Claudex - native source validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    name: Fast launcher and source checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - name: Source and shell syntax
        run: |
          python3 tools/audit-public-source.py
          bash -n claudex
          python3 -m py_compile tools/test-launcher-concurrency.py tools/test-local-auth.py
      - name: Test launcher without building native binaries
        run: python3 tools/test-launcher-port-guard.py

  native-rust:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs: fast-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS ARM64
            runner: macos-15
            arch: darwin-arm64
          - label: macOS x86-64
            runner: macos-15-intel
            arch: darwin-x86_64
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: linux-arm64
          - label: Linux x86-64
            runner: ubuntu-24.04
            arch: linux-x86_64
    env:
      CLAUDEX_BUILD_JOBS: "2"
      CLAUDEX_BUILD_WORKDIR: ${{ github.workspace }}/.claudex-native-build
    steps:
      - name: Checkout curated public source
        uses: actions/checkout@v4
      - name: Audit exact public source tree (no tokens, DevKit code or releases)
        shell: bash
        run: python3 tools/audit-public-source.py
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      # Cache dependency downloads and the expensive Codex target directory.
      # Key on exact pinned source and compiler, so a changed upstream or
      # transport source never silently reuses incompatible artifacts.
      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .claudex-native-build/target-codex
          key: native-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CODEX_REVISION', 'SHUNT_REVISION', 'transport-source/**', 'patches/claudex-shunt.patch') }}-v1
          restore-keys: |
            native-rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Build pinned shunt and secure Codex transport
        shell: bash
        run: bash tools/build-pinned-runtime.sh
      - name: Set up Node.js for synthetic SIWC local auth test
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test independent OS credential adapters without the noncommercial DevKit
        shell: bash
        run: node --test source/siwc-helper/keychain-store.test.mjs source/siwc-helper/secret-service-store.test.mjs
      - name: Verify authenticated proxy locally without inference
        shell: bash
        run: python3 tools/test-local-auth.py
      - name: Native launcher and T3 compatibility (synthetic, no inference)
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 tools/test-launcher-concurrency.py
      - name: Fresh-user install and uninstall with synthetic-only SIWC placeholder
        shell: bash
        run: |
          mkdir -p auth
          printf '#!/usr/bin/env node\nprocess.exit(99);\n' > auth/claudex-siwc.mjs
          chmod 700 auth/claudex-siwc.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 tools/test-fresh-install.py
      - name: Verify target files and no developer path leakage
        shell: bash
        run: |
          test -x "bin/${{ matrix.arch }}/shunt"
          test -x "bin/${{ matrix.arch }}/claudex-transport"
          # Source is checked by audit-public-source.py before builds.
          # Audit actual distributable executables here, not Cargo's temporary
          # checkout/depfile cache (which contains builder paths by design).
          python3 tools/audit-release.py "bin/${{ matrix.arch }}"
          if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 "bin/${{ matrix.arch }}"/*
          else
            sha256sum "bin/${{ matrix.arch }}"/*
          fi

      # No artifact uploads, tags, package publishing or deployments.
