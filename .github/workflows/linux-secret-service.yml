# Actual ephemeral GNOME Keyring on Linux x86-64 and ARM64; synthetic secrets only.
# No real ChatGPT account, DevKit, hosted API, model inference or artifacts.
name: Claudex - Linux Secret Service integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-secret-service.yml"
      - "tools/test-real-linux-keyring.sh"
      - "source/siwc-helper/secret-service-store.mjs"
  pull_request:
    paths:
      - ".github/workflows/linux-secret-service.yml"
      - "tools/test-real-linux-keyring.sh"
      - "source/siwc-helper/secret-service-store.mjs"

permissions:
  contents: read

jobs:
  encrypted-keyring:
    name: ${{ matrix.arch }} synthetic keyring
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install disposable D-Bus/Secret Service dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring libsecret-tools dbus-user-session dbus-x11
      - name: Exercise actual AES-GCM encryption with synthetic keyring
        run: |
          CLAUDEX_TEST_ISOLATED_KEYRING=1 dbus-run-session -- bash tools/test-real-linux-keyring.sh
